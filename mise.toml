[settings]
lockfile = true
task.run_auto_install = false
task.source_freshness_hash_contents = true

[tools]
node = "24.19.0"
pnpm = "11.22.0"
hk = "1.57.0"
pkl = "0.32.1"
typos = "1.50.1"
betterleaks = "1.7.4"
actionlint = "1.7.12"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.data]
description = "Regenerate src/registry.ts from emojibase-data"
sources = ["data.ts", "node_modules/emojibase-data/package.json"]
outputs = ["src/registry.ts"]
run = """
node data.ts
oxfmt src/registry.ts
"""
