name: Test

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  vitest:
    name: vitest (satteri ${{ matrix.satteri }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        satteri: [lockfile, "0.7"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install satteri ${{ matrix.satteri }}
        if: matrix.satteri != 'lockfile'
        run: pnpm add -D satteri@${{ matrix.satteri }}

      - name: Run tests with coverage
        run: pnpm cov

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.satteri == 'lockfile' }}
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: ./junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Codecov
        if: matrix.satteri == 'lockfile'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
