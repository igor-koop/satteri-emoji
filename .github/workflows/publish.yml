name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  actions:
    name: Actions
    uses: ./.github/workflows/actions.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    name: Publish to npm
    needs: actions
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    environment:
      name: npm
      url: https://www.npmjs.com/package/satteri-emoji

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish package
        run: npm publish --provenance --access public
