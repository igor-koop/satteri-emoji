name: Data

on:
  workflow_call:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate registry
        run: mise run --force data

      - name: Detect stale registry
        run: git diff --exit-code src/registry.ts
